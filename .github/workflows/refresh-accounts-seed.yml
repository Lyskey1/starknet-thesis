# TODO: remove the vesper target after merge
# Daily refresh of the ACCOUNT CONTRACTS seed (strk.html).
#
# Why Actions: Voyager is Cloudflare-challenge-gated for container and
# Vercel egress, but Actions runner IPs pass (verified 2026-08-10, HTTP 200
# with full JSON). The script validates hard before writing; a failed or
# gated fetch fails the run visibly and commits nothing, so the site keeps
# its last verified seed and the card's note keeps that seed's own date.
#
# Pushes use the workflow's own GITHUB_TOKEN (contents: write) — no new
# secrets — and GITHUB_TOKEN pushes do not retrigger workflows, so no
# recursion. Each commit redeploys the static site via the Vercel
# integration, which is how the fresh seed reaches production.
name: refresh account contracts seed
on:
  schedule:
    - cron: '17 4 * * *' # off-peak UTC, avoids the top-of-hour thundering herd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: fetch, validate, write seed
        run: node scripts/refresh-accounts-seed.mjs
      - name: commit when changed
        run: |
          if git diff --quiet public/assets/data/voyager-accounts-seed.json 2>/dev/null \
             && git ls-files --error-unmatch public/assets/data/voyager-accounts-seed.json >/dev/null 2>&1; then
            echo "seed unchanged, nothing to commit"; exit 0
          fi
          head=$(node -e "console.log(require('./public/assets/data/voyager-accounts-seed.json').head)")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/data/voyager-accounts-seed.json
          git commit -m "data: account contracts seed refresh, head $head, source Voyager"
          git push
      # the deploy branch lags main between merges, so the same refreshed seed
      # lands on vesper too (same content, same message, vesper second); a
      # rejected push rebases once and retries. Runs even when the current
      # branch's copy was already fresh, so a lagging vesper still catches up.
      - name: mirror the refreshed seed to vesper
        run: |
          set -e
          src=assets/data/voyager-accounts-seed.json
          [ -f public/assets/data/voyager-accounts-seed.json ] && src=public/assets/data/voyager-accounts-seed.json
          cp "$src" /tmp/voyager-seed.json
          head=$(node -e "console.log(require('/tmp/voyager-seed.json').head)")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin vesper
          git checkout -B vesper origin/vesper
          cp /tmp/voyager-seed.json public/assets/data/voyager-accounts-seed.json
          if git diff --quiet public/assets/data/voyager-accounts-seed.json; then
            echo "vesper seed already current"; exit 0
          fi
          git add public/assets/data/voyager-accounts-seed.json
          git commit -m "data: account contracts seed refresh, head $head, source Voyager"
          if ! git push origin vesper; then
            echo "vesper push rejected; rebasing once and retrying"
            git fetch origin vesper
            git rebase origin/vesper
            git push origin vesper
          fi
