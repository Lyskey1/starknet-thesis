# One-shot first contact with the Starkscan holders analytics endpoint
# (Phase 0 of the TOKEN HOLDERS metric). Uses the STARKSCAN_API_KEY repo
# secret via env only; the key is never echoed and response headers are
# filtered to rate-limit fields before printing. Manual dispatch only;
# this file dies once the contract is recorded (same lifecycle as the
# retired egress and vocabulary probes).
name: starkscan first contact
on:
  workflow_dispatch:

jobs:
  contact:
    runs-on: ubuntu-latest
    env:
      STARKSCAN_API_KEY: ${{ secrets.STARKSCAN_API_KEY }}
    steps:
      - name: holders analytics for STRK
        run: |
          if [ -z "$STARKSCAN_API_KEY" ]; then echo "secret missing"; exit 1; fi
          STRK=0x04718f5a0fc34cc1af16a1cdee98ffb20c31f5cd61d6ab07201858f4287c938d
          for chain in SN_MAIN; do
            echo "=== chain=$chain"
            code=$(curl -sS -m 25 -D headers.txt -o body.json -w "%{http_code}" \
              "https://api.starkscan.co/v1/$chain/token/$STRK/holders/analytics" \
              -H "X-Starkscan-Api-Key: $STARKSCAN_API_KEY" \
              -H "Accept: application/json" || echo "curl-failed")
            echo "HTTP $code"
            echo "--- rate-limit and validator headers only"
            grep -i -E "ratelimit|rate-limit|retry-after|etag|last-modified|x-request-id" headers.txt || echo "(none)"
            echo "--- body"
            head -c 1500 body.json; echo
          done
