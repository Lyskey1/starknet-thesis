# One-shot read-tier probe: does /metrics/network's activeSenderCount act
# as distinct-senders-per-bucket (monthly bucket >> daily bucket => an
# MAU-shaped metric), and what does /metrics/wallets carry? Key via env
# only, never echoed; response headers filtered. Dies once recorded.
name: starkscan activity probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      STARKSCAN_API_KEY: ${{ secrets.STARKSCAN_API_KEY }}
    steps:
      - name: network metrics windows and wallets
        run: |
          if [ -z "$STARKSCAN_API_KEY" ]; then echo "secret missing"; exit 1; fi
          probe(){
            echo "=== $1"
            code=$(curl -sS -m 25 -o body.json -w "%{http_code}" \
              "https://api.starkscan.co$1" -H "X-Starkscan-Api-Key: $STARKSCAN_API_KEY" \
              -H "Accept: application/json" || echo "curl-failed")
            echo "HTTP $code"
          }
          probe "/v1/SN_MAIN/metrics/network?window=all"
          python3 -c "
          import json
          d=json.load(open('body.json'))
          top={k:v for k,v in d.items() if k!='items'}
          print('top-level:',json.dumps(top))
          items=d.get('items',[])
          print('buckets:',len(items),'granularity:',d.get('bucketGranularity'))
          if items:
            print('first bucket verbatim:',json.dumps(items[0]))
            print('last COMPLETE-ish bucket:',json.dumps(items[-2] if len(items)>1 else items[-1]))
          "
          probe "/v1/SN_MAIN/metrics/network?window=30d"
          python3 -c "
          import json
          d=json.load(open('body.json'))
          items=d.get('items',[])
          print('buckets:',len(items),'granularity:',d.get('bucketGranularity'))
          if items: print('one daily bucket verbatim:',json.dumps(items[-2] if len(items)>1 else items[-1]))
          "
          probe "/v1/SN_MAIN/metrics/wallets"
          head -c 1400 body.json; echo
